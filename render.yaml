# Render Blueprint -- free-tier, single service, no secrets required.
# In the Render dashboard: New + -> Blueprint -> point at this repo. It reads
# this file and creates the service below. Nothing to configure; no API keys.
#
# Free tier notes: 512MB RAM, spins down after ~15 min idle (first request after
# that takes ~30-60s to wake). Fine for a portfolio link.
services:
  - type: web
    name: llm-security-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Full 3-layer ensemble -- fits the free tier because layer 3 is served
      # torch-free (gateway/detectors/classifier_numpy.py). See docs/decisions.md.
      - key: GATEWAY_LITE
        value: "0"
      # The real Project 2 (operations-assistant) runs as its own Render service.
      # The gateway reaches it over HTTP via its PUBLIC, keyless, IP-rate-limited
      # /demo/chat endpoint -- so no secret is needed here. Point this at your
      # operations-assistant URL (or remove both lines to hide that backend).
      - key: OPS_ASSISTANT_URL
        value: "https://operations-assistant.onrender.com"
      - key: OPS_ASSISTANT_CHAT_PATH
        value: "/demo/chat"
      - key: OPS_ASSISTANT_TIMEOUT
        value: "120"
      # Layer 2 (embedding similarity) disabled: the TF-IDF layer scored 0% on the project's own
      # corpus and was ~a coin flip on external data (docs/ensemble-ablation.md). This is also the
      # code default; kept explicit here so the intent is clear.
      - key: EMBEDDING_BACKEND
        value: "none"
      # Per-IP request budget for the unauthenticated endpoints (0 disables). TRUSTED_PROXY_HOPS is deliberately NOT set: it must equal
      # the number of proxies in front of the app, which has to be verified against the real X-Forwarded-For chain on this host.
      # Until then the peer address is used (all clients share one budget behind the platform proxy): conservative, not spoofable.
      - key: GATEWAY_IP_RATE_LIMIT
        value: "120"
