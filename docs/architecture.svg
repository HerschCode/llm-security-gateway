<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">LLM Security Gateway &#8212; request lifecycle</text>

  <!-- Caller -->
  <rect x="24" y="210" width="110" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="79" y="245" text-anchor="middle" font-size="13" fill="#1f2328">Caller</text>

  <!-- Pre-flight -->
  <rect x="176" y="90" width="250" height="300" rx="10" fill="#f6f8fa" stroke="#3fb950" stroke-width="1.5"/>
  <text x="301" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">1 &#183; PRE-FLIGHT</text>
  <rect x="196" y="132" width="210" height="46" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="301" y="152" text-anchor="middle" font-size="11" fill="#1f2328">PII detection / redaction</text>
  <text x="301" y="167" text-anchor="middle" font-size="9.5" fill="#656d76">gateway/pii.py</text>
  <rect x="196" y="186" width="210" height="86" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="301" y="205" text-anchor="middle" font-size="11" fill="#1f2328">Injection ensemble &#8212; block on any</text>
  <text x="301" y="222" text-anchor="middle" font-size="9.5" fill="#656d76">1. rule-based (regex/keyword)</text>
  <text x="301" y="236" text-anchor="middle" font-size="9.5" fill="#656d76">2. embedding similarity (TF-IDF)</text>
  <text x="301" y="250" text-anchor="middle" font-size="9.5" fill="#656d76">3. from-scratch torch classifier</text>
  <text x="301" y="264" text-anchor="middle" font-size="8.5" fill="#8c959f">+ adaptive per-session thresholds</text>
  <rect x="196" y="280" width="210" height="46" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="301" y="300" text-anchor="middle" font-size="11" fill="#1f2328">Rate limit + session anomaly</text>
  <text x="301" y="315" text-anchor="middle" font-size="9.5" fill="#656d76">gateway/session_checks.py</text>
  <text x="301" y="352" text-anchor="middle" font-size="9.5" fill="#8c959f">clean &#8594; forward</text>
  <text x="301" y="368" text-anchor="middle" font-size="9.5" fill="#cf222e">hit &#8594; block (no backend call)</text>

  <!-- Backend -->
  <rect x="468" y="180" width="180" height="120" rx="10" fill="#fff8f0" stroke="#d29922" stroke-width="1.5"/>
  <text x="558" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#9a6700">BACKEND ADAPTER</text>
  <text x="558" y="222" text-anchor="middle" font-size="9" fill="#656d76">send(prompt, session, role, user_id)</text>
  <text x="558" y="244" text-anchor="middle" font-size="9.5" fill="#1f2328">stub_ops_agent</text>
  <text x="558" y="258" text-anchor="middle" font-size="9.5" fill="#1f2328">project2_agent (reconstruction)</text>
  <text x="558" y="272" text-anchor="middle" font-size="9.5" fill="#1f2328">operations_assistant (real, HTTP)</text>
  <text x="558" y="290" text-anchor="middle" font-size="8.5" fill="#8c959f">one small class per backend</text>

  <!-- Post-flight -->
  <rect x="690" y="90" width="246" height="300" rx="10" fill="#f6f8fa" stroke="#3fb950" stroke-width="1.5"/>
  <text x="813" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">3 &#183; POST-FLIGHT</text>
  <rect x="710" y="140" width="206" height="46" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="813" y="160" text-anchor="middle" font-size="11" fill="#1f2328">Role-based data exposure</text>
  <text x="813" y="175" text-anchor="middle" font-size="9.5" fill="#656d76">gateway/role_exposure.py</text>
  <rect x="710" y="198" width="206" height="46" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="813" y="218" text-anchor="middle" font-size="11" fill="#1f2328">Jailbreak-compliance check</text>
  <text x="813" y="233" text-anchor="middle" font-size="9.5" fill="#656d76">gateway/response_checks.py</text>
  <rect x="710" y="256" width="206" height="46" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="813" y="276" text-anchor="middle" font-size="11" fill="#1f2328">System-prompt leak check</text>
  <text x="813" y="291" text-anchor="middle" font-size="9.5" fill="#656d76">re-run per chunk when streaming</text>
  <text x="813" y="332" text-anchor="middle" font-size="9.5" fill="#8c959f">clean &#8594; return response</text>
  <text x="813" y="348" text-anchor="middle" font-size="9.5" fill="#cf222e">hit &#8594; block / redact</text>

  <!-- Decision / log -->
  <rect x="404" y="418" width="152" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="440" text-anchor="middle" font-size="11" fill="#1f2328">allow / block + trace</text>
  <text x="480" y="456" text-anchor="middle" font-size="9" fill="#656d76">JSONL log &#8594; /gateway/dashboard</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#57606a"/>
    </marker>
  </defs>
  <line x1="134" y1="240" x2="172" y2="240" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="426" y1="240" x2="464" y2="240" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="648" y1="240" x2="686" y2="240" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M813,390 L813,446 L560,446" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M301,390 L301,446 L400,446" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
