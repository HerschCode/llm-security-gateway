name: Security

# Static analysis, secret scanning and container scanning (Phase 6; what each tool found, and what was fixed, is in docs/security-scans.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"          # weekly: new advisories appear without any change to this repository
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Bandit (hash-locked)
        run: pip install --require-hashes --no-deps -r requirements-ci.lock
      - name: Bandit on the shipped package (no finding of any severity is accepted)
        # gateway/ is the code that runs in production. Accepted exceptions carry an inline `# nosec` with the reason.
        run: bandit -r gateway -q
      - name: Bandit on scripts, the agent stub and the red-team harness (medium and above)
        # LOW findings here are seeded PRNGs for data sampling, subprocess calls with a fixed argv, and one assert (docs/security-scans.md).
        run: bandit -r scripts project2_agent redteam --exclude redteam/.venv-garak,redteam/runs --severity-level medium -q

  semgrep:
    runs-on: ubuntu-latest
    # Not yet a gate: Semgrep could not be run locally (its native Windows core fails on the maintainer's machine), so its first findings
    # have not been triaged. Flip this to blocking once they have; the report is kept as an artifact either way.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Semgrep (hash-locked)
        run: pip install --require-hashes --no-deps -r requirements-ci.lock
      - name: Semgrep (free rule packs)
        run: >
          semgrep scan --config p/python --config p/security-audit --config p/owasp-top-ten --metrics off
          --sarif --output semgrep.sarif --error gateway scripts project2_agent redteam/adaptive_attacker.py
          redteam/mutation_attacker.py redteam/run_garak.py redteam/summarize.py redteam/target_shim.py Dockerfile Dockerfile.render .github
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0           # scan the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Trivy filesystem scan (dependencies, secrets, Dockerfile and CI misconfigurations)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: redteam/.venv-garak,.venv,.venv-pii,.venv-sec,data

  trivy-image:
    runs-on: ubuntu-latest
    # Not yet a gate, for the same reason as Semgrep: the image could not be built or scanned locally (no Docker daemon on the maintainer's
    # machine), so the first findings (base-image packages included) have not been triaged. The report is kept as an artifact.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build the Render image
        run: docker build -f Dockerfile.render -t llm-security-gateway:scan .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: llm-security-gateway:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image.txt
