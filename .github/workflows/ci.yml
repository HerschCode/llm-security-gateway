name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (hash-locked)
        # requirements-render.lock is the torch-free serving set, the same one the Render image installs, compiled with hashes
        # (scripts/update_locks.sh): pip refuses any file whose SHA-256 differs. torch is only needed for training
        # (scripts/train_scratch_classifier.py), not for running or testing the gateway; layer 3 is served by classifier_numpy.py.
        run: |
          pip install --require-hashes --no-deps -r requirements-render.lock
          pip install --require-hashes --no-deps -r requirements-ci.lock
          # ONNX Runtime for the opt-in student guard: its tests run here instead of skipping (constrained to the render lock, so numpy does not move)
          pip install --require-hashes --no-deps -r requirements-student.lock

      - name: Run test suite
        run: python -m pytest tests/ -v
        env:
          MODEL_INTEGRITY: enforce      # the artifacts the tests load must match models/MANIFEST.sha256, as in the image

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff (hash-locked)
        run: pip install --require-hashes --no-deps -r requirements-ci.lock

      - name: Lint
        run: ruff check gateway/ tests/ scripts/ --output-format=github
        continue-on-error: true    # pre-existing style findings (docs/security-scans.md); not a security gate

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (hash-locked)
        run: pip install --require-hashes --no-deps -r requirements-ci.lock

      - name: Audit the pinned dependency sets for known vulnerabilities
        # Blocking: both sets were clean when this gate was added (0 known vulnerabilities in 24 and 38 packages).
        run: |
          pip-audit -r requirements-render.lock --require-hashes --strict
          pip-audit -r requirements.lock --require-hashes --strict
          pip-audit -r requirements-student.lock --require-hashes --strict

  openapi-contract:
    # The console generates its typed client from openapi/p3.json and the other services call these routes: a removed route, a removed response field or a newly
    # required request field breaks them silently. The spec is compared with its version before this push (or before the pull request's base), and a breaking
    # change fails the build unless the commit message says `openapi-break-ok`, which turns the failure into a warning that someone chose it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0          # the previous version of the spec has to be in the history

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: "1.26"      # oasdiff v1.33.0 declares go 1.26 and toolchain go1.27.1; the go command fetches that toolchain

      - name: Install oasdiff (pinned release)
        run: go install github.com/oasdiff/oasdiff@v1.33.0

      - name: No breaking change to openapi/p3.json
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA:openapi/p3.json" 2>/dev/null; then
            echo "no earlier version of openapi/p3.json to compare with"; exit 0
          fi
          git show "$BASE_SHA:openapi/p3.json" > "$RUNNER_TEMP/base.json"
          if "$(go env GOPATH)/bin/oasdiff" breaking "$RUNNER_TEMP/base.json" openapi/p3.json --fail-on ERR --format githubactions; then
            exit 0
          fi
          if git log -1 --format=%B | grep -q "openapi-break-ok"; then
            echo "::warning::breaking OpenAPI change, acknowledged by openapi-break-ok in the commit message"; exit 0
          fi
          echo "::error::breaking change to openapi/p3.json since $BASE_SHA. If it is intended, say openapi-break-ok in the commit message and update the console's pinned copy."
          exit 1
